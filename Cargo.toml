[package]
name = "mawaqit-tui"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

# tst/ harness contract: one integration-test target per tier, modules in the
# sibling directories (ut/, ct/, e2e/, fuzz/).
[[test]]
name = "ut"
path = "tst/ut.rs"

[[test]]
name = "ct"
path = "tst/ct.rs"

[[test]]
name = "e2e"
path = "tst/e2e.rs"

[[test]]
name = "fuzz"
path = "tst/fuzz.rs"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
mawaqit-api = "0.5.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.6"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
